# Streamlit config for Render deployment
# CLI flags in render.yaml startCommand will override these where applicable

[server]
headless = true
address = "0.0.0.0"
# CORS is disabled because the app is served directly on Render
enableCORS = false
# XSRF protection remains enabled for safety
enableXsrfProtection = true

[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f8ff"
textColor = "#262730"
